name: Deploy the preview to GitHub Pages

# This repository is the review preview of theaha.co: a copy of the site's
# main branch (theahaco/theahaco.github.io) where the clients hidden on
# theaha.co are shown, for their approval (src/data/curation.ts). Every page
# is marked noindex, because a build for any origin other than
# https://theaha.co is a preview, and the site sits in an unlisted folder of
# this Pages site, so only people who get the link can find it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PREVIEW_DIR: p-w11w35ur7d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build the preview
        run: npm run build
        env:
          # Not https://theaha.co, so the build is a preview: noindex everywhere.
          SITE_URL: https://theahaco.github.io
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/${{ env.PREVIEW_DIR }}

      - name: Check links, images and anchors
        run: npm run check
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/${{ env.PREVIEW_DIR }}

      - name: Check the preview is marked noindex
        run: grep -q 'name="robots" content="noindex"' dist/index.html dist/services/index.html

      - name: Put the site in its unlisted folder
        run: mkdir -p "site/${PREVIEW_DIR}" && cp -R dist/. "site/${PREVIEW_DIR}/"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
